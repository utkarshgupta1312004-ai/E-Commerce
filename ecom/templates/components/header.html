{% load static %}
<!-- ============================================================================== -->
<!-- Navigation Header (Desktop, Tablet & Mobile)                                   -->
<!-- ============================================================================== -->
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-3 sm:gap-4">
        
        <!-- Left Side: Mobile Menu Button & Brand Logo -->
        <div class="flex items-center gap-3 sm:gap-6 lg:gap-8">
            <!-- Mobile Hamburger Toggle (Visible on Mobile & Tablet) -->
            <button 
                id="mobile-menu-toggle"
                class="lg:hidden p-2 -ml-2 text-slate-700 hover:text-slate-950 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer" 
                aria-label="Toggle navigation menu"
            >
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>

            <!-- Brand Logo -->
            <a href="/" class="flex items-center group shrink-0">
                <img 
                    src="{% static 'images/cartivo-horizontal.png' %}" 
                    alt="Cartivo - Shop Smarter. Live Better." 
                    class="h-8 sm:h-10 md:h-11 w-auto object-contain transition-transform group-hover:scale-[1.02]"
                >
            </a>

            <!-- Desktop / High-Tablet Nav Links (1024px+) -->
            <nav class="hidden lg:flex items-center gap-7 text-sm font-medium text-slate-600">
                <a href="/products/" class="text-slate-950 font-semibold hover:text-blue-600 transition-colors">New Arrivals</a>
                <a href="/products/" class="hover:text-blue-600 transition-colors">Collections</a>
                <a href="/products/" class="hover:text-blue-600 transition-colors">Categories</a>
                <a href="/products/" class="text-amber-600 font-semibold hover:text-amber-700 transition-colors flex items-center gap-1.5">
                    <span>Sale</span>
                    <span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-1.5 py-0.5 rounded-full">20%</span>
                </a>
            </nav>
        </div>

        <!-- Center: Search Bar (Desktop & Tablet md+) -->
        <div class="hidden md:flex flex-1 max-w-xs lg:max-w-md mx-2 lg:mx-4">
            <div class="relative w-full">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input 
                    type="text" 
                    placeholder="Search audio, watches, apparel, bags..." 
                    class="w-full pl-10 pr-4 py-2 sm:py-2.5 bg-slate-100/80 hover:bg-slate-100 focus:bg-white text-xs sm:text-sm text-slate-800 placeholder-slate-400 rounded-full border border-transparent focus:border-blue-600 focus:ring-4 focus:ring-blue-500/15 outline-none transition-all"
                >
            </div>
        </div>

        <!-- Right Action Controls -->
        <div class="flex items-center gap-1 sm:gap-3">
            <!-- Mobile Search Toggle (Visible on <md) -->
            <button 
                id="mobile-search-toggle"
                class="md:hidden p-2 text-slate-700 hover:text-slate-950 hover:bg-slate-100 rounded-full transition-colors cursor-pointer" 
                title="Search"
                aria-label="Open search bar"
            >
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>

            <!-- Wishlist (Tablet & Desktop) -->
            <a href="/wishlist/" class="relative p-2 text-slate-700 hover:text-slate-950 hover:bg-slate-100 rounded-full transition-colors" title="Wishlist">
                <i data-lucide="heart" class="w-5 h-5"></i>
                <span class="absolute top-1 right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white">
                    3
                </span>
            </a>

            <!-- Account (Hidden on small mobile, handled in bottom bar & drawer) -->
            <a href="/accounts/login/" class="hidden sm:flex p-2 text-slate-700 hover:text-slate-950 hover:bg-slate-100 rounded-full transition-colors" title="My Account / Sign In">
                <i data-lucide="user" class="w-5 h-5"></i>
            </a>

            <!-- Cart Button -->
            <a href="/cart/" class="flex items-center gap-1.5 sm:gap-2 bg-slate-950 hover:bg-blue-600 text-white px-3 sm:px-4 py-2 sm:py-2.5 rounded-full text-xs font-semibold shadow-sm hover:shadow-md transition-all">
                <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Bag</span>
                <span class="bg-white/20 px-1.5 py-0.5 rounded-full text-[10px] font-bold">2</span>
                <span class="hidden lg:inline text-slate-300 font-medium pl-1 border-l border-white/20">$348</span>
            </a>
        </div>
    </div>

    <!-- Mobile Expandable Search Bar (Slide down on toggle) -->
    <div id="mobile-search-bar" class="hidden md:hidden px-4 pb-3 pt-1 border-t border-slate-100 bg-white">
        <div class="relative w-full">
            <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input 
                type="text" 
                placeholder="Search products, brands, collections..." 
                class="w-full pl-10 pr-4 py-2 bg-slate-100 text-sm text-slate-800 rounded-full border border-transparent focus:border-blue-600 focus:bg-white outline-none"
                autofocus
            >
        </div>
    </div>
</header>
