<!-- VIP Newsletter Subscription Banner (Responsive Stacking)                       -->
<!-- ============================================================================== -->
<section class="py-12 sm:py-16 bg-slate-950 text-white relative overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="max-w-2xl mx-auto text-center space-y-4">
            <span class="text-xs font-bold text-amber-400 tracking-widest uppercase">The Collector's Circle</span>
            <h2 class="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight">Unlock Private Previews & 15% Off</h2>
            <p class="text-slate-400 text-xs sm:text-sm leading-relaxed px-2">
                Be the first to access limited-quantity drops, private trunk shows, and editorial lookbooks directly in your inbox.
            </p>

            <form class="flex flex-col sm:flex-row items-center gap-2.5 sm:gap-3 max-w-md mx-auto pt-2 sm:pt-4" onsubmit="event.preventDefault(); alert('Thank you for subscribing to Cartivo.');">
                <input 
                    type="email" 
                    required
                    placeholder="Enter your email address..." 
                    class="w-full px-5 py-3 rounded-full bg-white/10 border border-white/20 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 transition-all"
                >
                <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-7 py-3 rounded-full shrink-0 shadow-lg transition-all cursor-pointer">
                    Subscribe
                </button>
            </form>
            <div class="text-[11px] text-slate-500">We value discretion. Unsubscribe with one click anytime.</div>
        </div>
    </div>
</section>
