services:
  - type: web
    name: cartivo-ecommerce
    runtime: python
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn --chdir ecom ecom.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    plan: free
    autoDeploy: true
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUTF8
        value: "1"
      - key: USE_SQLITE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@cartivo.local"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
